<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#support — the ticket</title>
<style>
  /* Slide backdrop: neutral deep slate so the Slack window reads as the
     single object on screen. No decoration competing with it. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #15181d;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vmin;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Lato,
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The "screenshot": a Slack-faithful window, scaled for projectors. */
  .window {
    width: min(1100px, 94vw);
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8f8f8;
    border-bottom: 1px solid #e0e0e0;
    padding: 14px 18px;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .titlebar .app {
    flex: 1;
    text-align: center;
    color: #5f5f5f;
    font-size: 15px;
    /* offset the traffic lights so the title is optically centered */
    margin-right: 59px;
  }

  .channelbar {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 26px;
    border-bottom: 1px solid #e8e8e8;
  }
  .channelbar .name { font-size: 21px; font-weight: 800; color: #1d1c1d; }
  .channelbar .topic { font-size: 15px; color: #616061; }

  .day-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 26px 6px;
  }
  .day-divider .line { flex: 1; height: 1px; background: #e8e8e8; }
  .day-divider .pill {
    border: 1px solid #e0e0e0;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 14px;
    font-weight: 700;
    color: #1d1c1d;
  }

  .message {
    display: flex;
    gap: 16px;
    padding: 18px 26px 30px;
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 8px;
    background: #e8912d;
    color: #fff;
    font-size: 28px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .body { min-width: 0; }
  .meta { display: flex; align-items: baseline; gap: 10px; }
  .meta .user { font-size: 21px; font-weight: 900; color: #1d1c1d; }
  .meta .badge {
    background: #ececec;
    color: #616061;
    font-size: 12px;
    font-weight: 700;
    border-radius: 3px;
    padding: 2px 5px;
    position: relative;
    top: -2px;
  }
  .meta .time { font-size: 14px; color: #616061; }

  .text {
    margin-top: 8px;
    font-size: clamp(22px, 2.6vw, 30px);
    line-height: 1.45;
    color: #1d1c1d;
    max-width: 34em;
  }
  .text .mention {
    background: #e8f5fa;
    color: #1264a3;
    border-radius: 3px;
    padding: 0 3px;
    font-weight: 600;
  }

  .reactions { display: flex; gap: 8px; margin-top: 16px; }
  .reaction {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #eff8ff;
    border: 1px solid #b8d9f0;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 17px;
  }
  .reaction .count { font-size: 14px; font-weight: 700; color: #1264a3; }

  .thread {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 14px;
    font-size: 15px;
    font-weight: 700;
    color: #1264a3;
  }
  .thread .mini {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: #7a5c9e;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thread .when { color: #616061; font-weight: 400; }
</style>
</head>
<body>
  <div class="window" role="img"
       aria-label="Slack message in #support: checkout feels slow for a few customers, can't reproduce, no pattern.">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="app">Slack — Cartwheel</span>
    </div>

    <div class="channelbar">
      <span class="name"># support</span>
      <span class="topic">customer escalations &amp; triage</span>
    </div>

    <div class="day-divider">
      <span class="line"></span>
      <span class="pill">Today</span>
      <span class="line"></span>
    </div>

    <div class="message">
      <div class="avatar">P</div>
      <div class="body">
        <div class="meta">
          <span class="user">Priya Raman</span>
          <span class="badge">Support</span>
          <span class="time">4:47 PM</span>
        </div>
        <div class="text">
          hey <span class="mention">@product</span> — a few customers say
          checkout feels slow? can&rsquo;t repro on my machine. no pattern
          I can see 🤷
        </div>
        <div class="reactions">
          <span class="reaction">😬 <span class="count">2</span></span>
          <span class="reaction">👀 <span class="count">1</span></span>
        </div>
        <div class="thread">
          <span class="mini">J</span>
          2 replies
          <span class="when">Last reply today at 5:12 PM</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
